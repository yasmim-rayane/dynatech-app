<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2447" />
      <stop offset="100%" stop-color="#19376D" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#grad)" />
  
  <!-- Logo scale factor:
       The icon is 60% of the container. 1024 * 0.6 = 614.4
       The path is designed for a 48x48 box. 614.4 / 48 = 12.8 scale.
       Center offset: (1024 - 614.4) / 2 = 204.8 
  -->
  <g transform="translate(204.8, 204.8) scale(12.8)">
    <path
      d="M6 30 Q12 18, 18 30 T30 30 T42 30"
      stroke="#10D9A0"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="24" cy="14" r="3" fill="#10D9A0" />
  </g>
</svg>
