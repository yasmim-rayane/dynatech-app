version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: dynatech-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dynatech_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./apps/backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: dynatech-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dynatech_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
