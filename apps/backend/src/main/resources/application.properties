# ═══════════════════════════════════════════════════════════
#  DynaTech Server — application.properties
# ═══════════════════════════════════════════════════════════

# ── Servidor ──────────────────────────────────────────────
server.port=8080

# ── MySQL ─────────────────────────────────────────────────
# IMPORTANTE: Substitua pelos valores reais do seu ambiente
spring.datasource.url=jdbc:mysql://localhost:3306/dynatech_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── SQL init ───────────────────────────────────────────────
spring.sql.init.mode=always

# ── Jackson (serialização JSON) ──────────────────────────

spring.jackson.time-zone=America/Sao_Paulo

# ── E-mail (SMTP — Gmail como exemplo) ───────────────────
# IMPORTANTE: Use variáveis de ambiente ou perfis para credenciais reais
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dynaapptest1@gmail.com
spring.mail.password=oonazqypepxtseha
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Logging ──────────────────────────────────────────────
logging.level.root=INFO
logging.level.engComp.dynamometerApp_server=DEBUG
logging.level.org.hibernate.SQL=WARN
